<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <title>Army Green Birthday Cake with Minions</title>
    
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Cookie&family=Fredoka+One&family=Nunito:wght@600;800;900&display=swap");

      *, *:before, *:after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Nunito', sans-serif;
        background: radial-gradient(circle at center, #f4f7f0 0%, #e2e9dc 100%);
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      #gift-overlay {
        position: fixed;
        inset: 0;
        background: rgba(43, 54, 28, 0.94);
        backdrop-filter: blur(10px);
        z-index: 99999;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 20px;
        transition: opacity 0.8s ease, visibility 0.8s ease;
      }

      #gift-overlay.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .gift-box-wrapper {
        text-align: center;
        animation: pulseGift 2s ease-in-out infinite;
      }

      .gift-icon {
        font-size: clamp(3.5rem, 10vw, 5rem);
        margin-bottom: 15px;
        filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));
        display: inline-block;
        animation: bounceIcon 1.5s infinite alternate;
      }

      .gift-title {
        color: #f7f9f2;
        font-family: 'Fredoka One', cursive;
        font-size: clamp(1.5rem, 5vw, 2.2rem);
        letter-spacing: 1px;
        margin-bottom: 10px;
        text-shadow: 0 4px 8px rgba(0,0,0,0.3);
      }

      .gift-subtitle {
        color: #d2e0bf;
        font-size: clamp(0.85rem, 3vw, 1.1rem);
        margin-bottom: 25px;
        font-weight: 600;
      }

      .btn-open-gift {
        background: linear-gradient(135deg, #ffda27 0%, #f39c12 100%);
        color: #2b361c;
        font-family: 'Fredoka One', cursive;
        font-size: clamp(1.1rem, 4vw, 1.5rem);
        padding: 12px 28px;
        border: 4px solid #fff;
        border-radius: 50px;
        cursor: pointer;
        box-shadow: 0 10px 25px rgba(243, 156, 18, 0.5), inset 0 2px 4px rgba(255,255,255,0.8);
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0 auto;
      }

      .btn-open-gift:hover, .btn-open-gift:active {
        transform: scale(1.05) translateY(-2px);
        box-shadow: 0 15px 30px rgba(243, 156, 18, 0.7);
      }

      @keyframes bounceIcon {
        0% { transform: translateY(0) rotate(0deg); }
        100% { transform: translateY(-15px) rotate(6deg); }
      }

      @keyframes pulseGift {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.02); }
      }

      .tablet-layout {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        padding: 10px;
        position: relative;
        max-width: 1200px;
        margin: 0 auto;
      }

      .header-title-container {
        width: 100%;
        text-align: center;
        z-index: 10;
        margin-top: 5px;
      }

      .greeting {
        font-family: "Cookie", cursive;
        font-size: clamp(2rem, 6vw, 4.2rem);
        color: #3b4728;
        transform: scale(0);
        text-align: center;
        text-shadow: 2px 3px 0px rgba(255,255,255,0.8), 0 5px 15px rgba(59, 71, 40, 0.15);
        line-height: 1.1;
      }

      .sub-greeting {
        font-family: 'Fredoka One', cursive;
        color: #5d6e42;
        font-size: clamp(0.8rem, 2.5vw, 1.1rem);
        opacity: 0;
        margin-top: 4px;
        letter-spacing: 0.5px;
      }

      .stage-flex-wrapper {
        display: flex;
        width: 100%;
        height: 100%;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        position: relative;
      }

      .initial-photos-wrapper {
        position: absolute;
        inset: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        pointer-events: none;
        z-index: 25;
      }

      .minion-side-container {
        width: clamp(100px, 22vw, 180px);
        display: flex;
        flex-direction: column;
        align-items: center;
        pointer-events: auto;
      }

      .minion-side-container.bottom-center {
        position: absolute;
        bottom: 700px;
        left: 50%;
        transform: translateX(-50%);
        width: clamp(110px, 20vw, 170px);
        z-index: 30;
      }

      .minion-card {
        background: #fde047;
        border: 3px solid #1e3a8a;
        border-radius: 16px;
        padding: 6px 6px 10px 6px;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
        position: relative;
        width: 100%;
        text-align: center;
        opacity: 0;
        transform: translateY(40px);
        transition: transform 0.3s ease, opacity 0.5s ease;
      }

      .minion-card.floating-left { animation: floatCardLeft 4s ease-in-out infinite alternate; }
      .minion-card.floating-center { animation: floatCardCenter 3.8s ease-in-out infinite alternate; }
      .minion-card.floating-right { animation: floatCardRight 4.5s ease-in-out infinite alternate; }

      @keyframes floatCardLeft {
        0% { transform: translateY(0px) rotate(-2deg); }
        100% { transform: translateY(-8px) rotate(2deg); }
      }
      @keyframes floatCardCenter {
        0% { transform: translateY(0px) rotate(0deg); }
        100% { transform: translateY(-6px) rotate(1deg); }
      }
      @keyframes floatCardRight {
        0% { transform: translateY(0px) rotate(2deg); }
        100% { transform: translateY(-8px) rotate(-2deg); }
      }

      .minion-goggles {
        position: absolute;
        top: -12px;
        left: 50%;
        transform: translateX(-50%);
        width: clamp(55px, 12vw, 75px);
        height: 20px;
        background: #475569;
        border-radius: 10px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 3px;
        border: 2px solid #0f172a;
        box-shadow: 0 3px 5px rgba(0,0,0,0.2);
      }

      .goggle-eye {
        width: 15px;
        height: 15px;
        background: #fff;
        border-radius: 50%;
        border: 2px solid #94a3b8;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
      }

      .goggle-pupil {
        width: 5px;
        height: 5px;
        background: #451a03;
        border-radius: 50%;
        position: absolute;
      }

      .photo-frame {
        width: 100%;
        height: clamp(75px, 15vh, 130px);
        border-radius: 8px;
        overflow: hidden;
        border: 2px solid #1e3a8a;
        background: #ffffff;
        margin-top: 4px;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .photo-frame img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }

      .speech-bubble {
        background: #ffffff;
        border: 2px solid #1e3a8a;
        border-radius: 10px;
        padding: 2px 6px;
        font-family: 'Fredoka One', cursive;
        color: #1e3a8a;
        font-size: clamp(0.6rem, 1.8vw, 0.75rem);
        margin-top: 4px;
        display: inline-block;
        position: relative;
        box-shadow: 0 3px 6px rgba(0,0,0,0.08);
      }

      .speech-bubble:after {
        content: '';
        position: absolute;
        top: -6px;
        left: 50%;
        transform: translateX(-50%);
        border-width: 0 6px 6px 6px;
        border-style: solid;
        border-color: #1e3a8a transparent;
        display: block;
        width: 0;
      }

      .final-photo-wrapper {
        position: absolute;
        top: 53%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0.5);
        z-index: 100;
        display: none;
        opacity: 0;
        flex-direction: column;
        align-items: center;
        pointer-events: auto;
        width: 90%;
        max-width: 300px;
      }

      .final-photo-card {
        background: linear-gradient(135deg, #fde047 0%, #facc15 100%);
        border: 4px solid #1e3a8a;
        border-radius: 20px;
        padding: 12px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.35);
        width: 100%;
        text-align: center;
        position: relative;
        animation: floatFinalCard 3s ease-in-out infinite alternate;
      }

      @keyframes floatFinalCard {
        0% { transform: translateY(0px) rotate(-1deg); }
        100% { transform: translateY(-8px) rotate(1deg); }
      }

      .final-photo-frame {
        width: 100%;
        height: clamp(150px, 30vh, 200px);
        border-radius: 12px;
        overflow: hidden;
        border: 3px solid #1e3a8a;
        background: #ffffff;
        margin-top: 8px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .final-photo-frame img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }

      .final-speech-bubble {
        background: #ffffff;
        border: 2px solid #1e3a8a;
        border-radius: 16px;
        padding: 5px 12px;
        font-family: 'Fredoka One', cursive;
        color: #1e3a8a;
        font-size: clamp(0.85rem, 3vw, 1rem);
        margin-top: 8px;
        display: inline-block;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      }

      .cake-center-stage {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        height: 100%;
        width: 100%;
      }

      .svg {
        position: absolute;
        width: 0;
        height: 0;
      }

      .plate {
        position: relative;
        width: clamp(180px, 40vw, 280px);
        height: clamp(50px, 12vw, 85px);
        background: #e6eae1;
        margin-top: clamp(30px, 8vw, 60px);
        border-radius: 50%;
        box-shadow: 0px 12px 20px rgba(43, 54, 28, 0.25), inset 0 3px 6px #ffffff;
        display: grid;
        place-items: center;
        border: 2px solid #d0d7c7;
      }

      .cake-wrap {
        position: absolute;
        bottom: 45%;
      }

      .cake-base {
        position: relative;
        width: clamp(140px, 32vw, 220px);
        height: clamp(35px, 8vw, 55px);
        background: #2b2326;
      }

      .cake-base .base-front {
        position: absolute;
        width: 100%;
        height: 100%;
        background: inherit;
      }

      .cake-base .base-front:after {
        content: "";
        position: absolute;
        left: 0;
        top: 100%;
        width: 100%;
        height: clamp(40px, 9vw, 60px);
        transform: translateY(-50%);
        background: inherit;
        border-radius: 50%;
      }

      .cake-base .base-top {
        position: absolute;
        width: 100%;
        height: clamp(45px, 10vw, 70px);
        top: 0;
        transform: translateY(-50%);
        border-radius: 50%;
        background: inherit;
      }

      .cake-topping {
        position: absolute;
        bottom: 0%;
        width: clamp(140px, 32vw, 220px);
        height: clamp(70px, 15vw, 110px);
        z-index: 15;
      }

      .cake-topping .topping-front {
        width: 100%;
        height: 100%;
        background: linear-gradient(to bottom, #3f4d2a 40%, transparent);
      }

      .cake-topping .topping-front .top-layer {
        height: 30%;
        background: #4b5a32;
      }

      .cake-topping .topping-front .bottom-layer {
        position: relative;
        height: 70%;
        background: #4b5a32;
        clip-path: url("#my-clip-path");
      }

      .cake-topping .topping-top {
        background: #5a6d3c;
        position: absolute;
        width: 100%;
        height: clamp(45px, 10vw, 70px);
        top: 0;
        transform: translateY(-50%);
        border-radius: 50%;
        z-index: 9;
      }

      .candle-container {
        width: clamp(140px, 32vw, 220px);
        position: absolute;
        bottom: 60%;
        z-index: 20;
        opacity: 0;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .candle-container .candle-wrap {
        position: relative;
        width: clamp(12px, 3vw, 16px);
        cursor: pointer;
      }

      .candle-container .flame-wrap {
        position: relative;
        z-index: 99;
        width: 100%;
        background: linear-gradient(to top, #ff9800, #ffeb3b);
        height: clamp(22px, 5vw, 30px);
        transform-origin: bottom center;
        transform: scale(0);
        clip-path: url(#my-flame-path);
        filter: drop-shadow(0 0 10px #ff9800);
      }

      .candle-container .flame-wrap.extinguished {
        transform: scale(0) !important;
        opacity: 0 !important;
      }

      .candle-container .candle-top {
        position: absolute;
        top: 0;
        left: 0;
        transform: translateY(-50%);
        width: 100%;
        height: 6px;
        border-radius: 50%;
        z-index: 9;
        background: radial-gradient(#fff, #facc15);
      }

      .candle-container .candle-base {
        position: relative;
        width: 100%;
        height: clamp(45px, 10vw, 75px);
        margin: 2px 0;
        background: repeating-linear-gradient(45deg, #facc15, #facc15 8px, #1d4ed8 8px, #1d4ed8 16px);
        border-radius: 2px;
      }

      .blow-hint {
        position: absolute;
        top: -36px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(255, 255, 255, 0.95);
        color: #2b361c;
        padding: 4px 10px;
        border-radius: 20px;
        font-size: clamp(0.65rem, 2vw, 0.8rem);
        font-family: 'Fredoka One', cursive;
        box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        white-space: nowrap;
        pointer-events: none;
        animation: hintFloat 1.5s infinite alternate;
        border: 2px solid #a3e635;
      }

      @keyframes hintFloat {
        0% { transform: translate(-50%, 0); }
        100% { transform: translate(-50%, -5px); }
      }

      .candle-container .star {
        width: 14px;
        height: 14px;
        position: absolute;
        background-color: #facc15;
        clip-path: url(#my-star-path);
        opacity: 0;
      }

      .candle-container .star:nth-of-type(1) { top: -30%; left: 20%; }
      .candle-container .star:nth-of-type(2) { top: 25%; left: -15%; }
      .candle-container .star:nth-of-type(3) { top: -15%; left: 95%; }
      .candle-container .star:nth-of-type(4) { top: 40%; left: 80%; }
      .candle-container .star:nth-of-type(5) { top: 65%; left: 105%; }

      .bottom-controls {
        z-index: 50;
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-bottom: 6px;
      }

      .ctrl-btn {
        background: #ffffff;
        color: #3b4728;
        border: 2px solid #a3b88c;
        padding: 8px 18px;
        border-radius: 25px;
        font-family: 'Fredoka One', cursive;
        font-size: clamp(0.75rem, 2.5vw, 0.95rem);
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.06);
        transition: all 0.2s ease;
      }

      .ctrl-btn:hover, .ctrl-btn:active {
        background: #3b4728;
        color: #ffffff;
        border-color: #3b4728;
      }

     @media (max-width: 480px) {
  .minion-side-container.bottom-center {
    display: flex;       /* Tanggalin ang display: none */
    bottom: 15%;         /* Ibaba ang pwesto para hindi lumagpas sa screen */
    transform: translateX(-50%) scale(0.8); /* Paliitin nang konti para magkasya */
  }
  .speech-bubble {
    font-size: 0.6rem;
    padding: 1px 4px;
  }
  .bottom-controls {
    margin-bottom: 4px;
  }
}
    </style>
  </head>
  <body>

    <div id="gift-overlay">
      <div class="gift-box-wrapper">
        <div class="gift-icon">🎁</div>
        <h1 class="gift-title">A Surprise Awaits!</h1>
        <p class="gift-subtitle">Tap below to open your special birthday gift</p>
        <button class="btn-open-gift" id="btn-start">
          <span>Open Your Gift</span> 🎁
        </button>
      </div>
    </div>

    <div class="tablet-layout">
      <div class="header-title-container">
        <div class="greeting">Happy Birthday Janeeee!!!!</div>
        <div class="sub-greeting" id="sub-msg">Bello! Have a Minion-tastic Birthday! 🍌</div>
      </div>

      <div class="stage-flex-wrapper">
        <div class="initial-photos-wrapper" id="initial-photos-group">
          
          <div class="minion-side-container left">
            <div class="minion-card floating-left" id="card-left">
              <div class="minion-goggles">
                <div class="goggle-eye"><div class="goggle-pupil"></div></div>
                <div class="goggle-eye"><div class="goggle-pupil"></div></div>
              </div>
              <div class="photo-frame">
                <img id="img-left" src="bob.png" alt="Picture 1">
              </div>
              <div class="speech-bubble">Bello! 🍌</div>
            </div>
          </div>

          <div class="minion-side-container bottom-center">
            <div class="minion-card floating-center" id="card-center">
              <div class="minion-goggles">
                <div class="goggle-eye"><div class="goggle-pupil"></div></div>
              </div>
              <div class="photo-frame">
                <img id="img-center" src="stuart.png" alt="Picture 2">
              </div>
              <div class="speech-bubble">Banana! 🍌</div>
            </div>
          </div>

          <div class="minion-side-container right">
            <div class="minion-card floating-right" id="card-right">
              <div class="minion-goggles">
                <div class="goggle-eye"><div class="goggle-pupil"></div></div>
                <div class="goggle-eye"><div class="goggle-pupil"></div></div>
              </div>
              <div class="photo-frame">
                <img id="img-right" src="kevin.png" alt="Picture 3">
              </div>
              <div class="speech-bubble">Poopaye! 🎉</div>
            </div>
          </div>

        </div>

        <div class="final-photo-wrapper" id="final-photo-wrapper">
          <div class="final-photo-card">
            <div class="minion-goggles" style="width: 80px; height: 22px; top: -14px;">
              <div class="goggle-eye" style="width: 18px; height: 18px;"><div class="goggle-pupil" style="width: 6px; height: 6px;"></div></div>
              <div class="goggle-eye" style="width: 18px; height: 18px;"><div class="goggle-pupil" style="width: 6px; height: 6px;"></div></div>
            </div>
            <div class="final-photo-frame">
              <img id="img-final" src="trio.png" alt="Final Revealed Picture">
            </div>
            <div class="final-speech-bubble">✨ Surprise! Happy Birthday! 💖</div>
          </div>
        </div>

        <div class="cake-center-stage">
          <div class="plate">
            <div class="cake-wrap">
              <div class="cake-topping">
                <div class="topping-top">
                  <div class="candle-container">
                    <div class="star"></div>
                    <div class="star"></div>
                    <div class="star"></div>
                    <div class="star"></div>
                    <div class="star"></div>
                    
                    <div class="candle-wrap" id="candle-trigger">
                      <div class="blow-hint" id="blow-hint">Blow Flame! 🌬️</div>
                      <div class="flame-wrap" id="flame"></div>
                      <div class="candle-base">
                        <div class="candle-top"></div>
                      </div>
                    </div>
                  </div>
                </div>
                <div class="topping-front">
                  <div class="top-layer"></div>
                  <div class="bottom-layer"></div>
                </div>
              </div>

              <div class="cake-base">
                <div class="base-front"></div>
                <div class="base-top"></div>
              </div>
            </div>
          </div>
        </div>

      </div>

      <div class="bottom-controls">
     
      </div>
    </div>

    <svg class="svg">
      <clipPath id="my-clip-path" clipPathUnits="objectBoundingBox">
        <path d="M0,0 V0.481 s0.021,0.37,0.078,0.404 s0.035,-0.296,0.102,-0.27 s0.007,0.363,0.096,0.354 s0.028,-0.466,0.1,-0.487 S0.406,0.999,0.457,0.999 s0.03,-0.502,0.075,-0.518 s0.041,0.488,0.081,0.274 c0.007,-0.038,0.021,-0.187,0.044,-0.215 c0.014,-0.017,0.038,0.401,0.075,0.392 s0.023,-0.28,0.074,-0.392 c0.022,-0.04,0.072,0.359,0.1,0.344 c0.057,-0.029,0.094,-0.405,0.094,-0.405 V-0.001"></path>
      </clipPath>
      <clipPath id="my-flame-path" clipPathUnits="objectBoundingBox">
        <path d="M0.501,0 s0.188,0.101,0.295,0.238 s0.123,0.15,0.169,0.286 S1,0.74,0.928,0.838 S0.711,1,0.501,1 S0.216,0.937,0.09,0.838 s-0.083,-0.149,0,-0.29 s0.23,-0.139,0.333,-0.276 S0.501,0,0.501,0"></path>
      </clipPath>
      <clipPath id="my-star-path" clipPathUnits="objectBoundingBox">
        <path d="M0.5,0.846 l-0.309,0.154,0.044,-0.357 L0,0.382 l0.336,-0.067 L0.5,0 l0.164,0.315,0.336,0.067,-0.235,0.261,0.044,0.357"></path>
      </clipPath>
    </svg>

    <script>
      class SoundFX {
        constructor() {
          this.ctx = null;
        }

        init() {
          if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
          }
        }

        playChime() {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.12);
            gain.gain.setValueAtTime(0.15, now + idx * 0.12);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.8);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + idx * 0.12);
            osc.stop(now + idx * 0.12 + 0.8);
          });
        }

        playBlowOut() {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const bufferSize = this.ctx.sampleRate * 0.4;
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
          }
          const noise = this.ctx.createBufferSource();
          noise.buffer = buffer;

          const filter = this.ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(800, now);
          filter.frequency.exponentialRampToValueAtTime(100, now + 0.4);

          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);

          noise.start(now);
          noise.stop(now + 0.4);
        }
      }

      const sfx = new SoundFX();
      let candleBlons = false; 

      $(document).ready(function() {

        const timeline = gsap.timeline({ paused: true });

        timeline.fromTo('.cake-topping', {
          yPercent: -300,
          opacity: 0.5
        }, {
          yPercent: 0,
          opacity: 1,
          duration: 0.8,
          ease: "bounce.out"
        });

        timeline.to('.candle-container', {
          opacity: 1,
          duration: 0.5,
          ease: 'power2.out'
        });

        timeline.to('.flame-wrap', {
          scale: 1,
          duration: 0.6,
          ease: "back.out(2)"
        });

        timeline.to('.greeting', {
          scale: 1,
          duration: 0.7,
          ease: "back.out(1.7)"
        });

        timeline.to('#sub-msg', {
          opacity: 1,
          y: -5,
          duration: 0.4
        });

        timeline.to('.minion-card', {
          opacity: 1,
          y: 0,
          stagger: 0.15,
          duration: 0.6,
          ease: "back.out(1.4)"
        });

        timeline.to('.star', {
          opacity: 0.8,
          stagger: 0.08,
          duration: 0.4,
          onComplete: function () {
            gsap.to('.star', {
              scale: 0.3,
              repeat: -1,
              stagger: 0.15,
              yoyo: true,
              ease: "power1.inOut"
            });
          }
        });

        $('#btn-start').on('click', function() {
          sfx.playChime();
          
          confetti({
            particleCount: 80,
            spread: 70,
            origin: { y: 0.6 }
          });

          $('#gift-overlay').addClass('hidden');

          setTimeout(() => {
            timeline.play();
          }, 400);
        });

        /* ACTION KAPAG HINIHIPAN ANG KANDILA */
        $('#candle-trigger').on('click', function() {
          if (candleBlons) return;
          candleBlons = true;

          sfx.playBlowOut();

          $('#flame').addClass('extinguished');
          $('#blow-hint').text('Wish Granted! ✨').css('background', '#fde047');

          confetti({ particleCount: 100, spread: 80, origin: { y: 0.6 } });

          gsap.to('#sub-msg', {
            opacity: 0,
            y: -10,
            duration: 0.2,
            onComplete: function() {
              $('#sub-msg').text('May all your birthday wishes come true! ✨🎂');
              gsap.to('#sub-msg', { opacity: 1, y: -5, duration: 0.3 });
            }
          });

          gsap.to('.minion-card', {
            opacity: 0,
            scale: 0.5,
            y: 30,
            duration: 0.5,
            stagger: 0.1,
            onComplete: function() {
              $('.initial-photos-wrapper').css('pointer-events', 'none');
            }
          });

          setTimeout(() => {
            $('#final-photo-wrapper').css('display', 'flex');
            gsap.to('#final-photo-wrapper', {
              opacity: 1,
              scale: 1,
              duration: 0.8,
              ease: "back.out(1.5)"
            });
          }, 300);
        });

        /* ACTION KAPAG I-CLICK ANG RE-LIGHT CANDLE */
        $('#btn-relight').on('click', function() {
          sfx.playChime();

          // I-clear ang anumang GSAP animation sa flame para malinis ang pag-reset
          gsap.killTweensOf('#flame');
          
          // Tanggalin ang extinguished class at ibalik sa scale 1 gamit ang gsap.set
          $('#flame').removeClass('extinguished');
          gsap.set('#flame', { scale: 1, opacity: 1 });

          // I-reset ang flag para pwede na ulit ma-blow
          candleBlons = false;

          $('#blow-hint').text('Blow Flame! 🌬️').css('background', 'rgba(255, 255, 255, 0.95)');

          gsap.to('#final-photo-wrapper', {
            opacity: 0,
            scale: 0.5,
            duration: 0.4,
            onComplete: function() {
              $('#final-photo-wrapper').css('display', 'none');
              $('.initial-photos-wrapper').css('pointer-events', 'auto');
              
              gsap.to('.minion-card', {
                opacity: 1,
                scale: 1,
                y: 0,
                duration: 0.5,
                stagger: 0.1
              });
            }
          });

          gsap.to('#sub-msg', {
            opacity: 0,
            duration: 0.2,
            onComplete: function() {
              $('#sub-msg').text('Bello! Have a Minion-tastic Birthday! 🍌');
              gsap.to('#sub-msg', { opacity: 1, y: -5, duration: 0.3 });
            }
          });
        });

      });
    </script>
  </body>
</html>
